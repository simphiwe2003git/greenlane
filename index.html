<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Greenlane Trading 101 | Import & Export | Customs Clearing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client"
  }
}
</script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E3A5F',
                        secondary: '#0F2A40',
                        accent: '#D4AF37',
                        soft: '#F5F0E8',
                        warm: '#FFF8F0',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 18s infinite ease-in-out',
                        'float-slow': 'float 25s infinite ease-in-out',
                        'float-fast': 'float 12s infinite ease-in-out',
                        'pulse-slow': 'pulse 3s infinite',
                        'pulse-fast': 'pulse 1.5s infinite',
                        'fadeUp': 'fadeUp 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards',
                        'fadeLeft': 'fadeLeft 0.7s ease forwards',
                        'fadeRight': 'fadeRight 0.7s ease forwards',
                        'fadeDown': 'fadeDown 0.7s ease forwards',
                        'zoomSoft': 'zoomSoft 0.6s ease-out forwards',
                        'glowPulse': 'glowPulse 2s infinite',
                        'driveTruck': 'driveTruck 14s linear infinite',
                        'flyPlane': 'flyPlane 12s ease-in-out infinite',
                        'bounceLight': 'bounceLight 2s infinite',
                        'bounceGentle': 'bounceGentle 3s infinite',
                        'spinSlow': 'spinSlow 20s linear infinite',
                        'spinMedium': 'spinMedium 12s linear infinite',
                        'wiggle': 'wiggle 0.5s ease-in-out infinite',
                        'shake': 'shake 0.8s ease-in-out infinite',
                        'pulseScale': 'pulseScale 2s infinite',
                        'rotateY':  'rotateY 0.8s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '33%': { transform: 'translateY(-25px) rotate(3deg)' },
                            '66%': { transform: 'translateY(15px) rotate(-3deg)' },
                        },
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(50px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeLeft: {
                            '0%': { opacity: '0', transform: 'translateX(-50px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                        fadeRight: {
                            '0%': { opacity: '0', transform: 'translateX(50px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                        fadeDown: {
                            '0%': { opacity: '0', transform: 'translateY(-30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        zoomSoft: {
                            '0%': { opacity: '0', transform: 'scale(0.9)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        glowPulse: {
                            '0%, 100%': { textShadow: '0 0 5px rgba(212,175,55,0.3)' },
                            '50%': { textShadow: '0 0 25px rgba(212,175,55,0.8)' },
                        },
                        driveTruck: {
                            '0%': { transform: 'translateX(-150%) translateY(0px)' },
                            '25%': { transform: 'translateX(-50%) translateY(-5px)' },
                            '50%': { transform: 'translateX(0%) translateY(0px)' },
                            '75%': { transform: 'translateX(50%) translateY(-5px)' },
                            '100%': { transform: 'translateX(150%) translateY(0px)' },
                        },
                        flyPlane: {
                            '0%': { transform: 'translateX(-180%) translateY(0px) rotate(0deg)' },
                            '20%': { transform: 'translateX(-80%) translateY(-25px) rotate(6deg)' },
                            '40%': { transform: 'translateX(-30%) translateY(-10px) rotate(-3deg)' },
                            '60%': { transform: 'translateX(20%) translateY(-20px) rotate(4deg)' },
                            '80%': { transform: 'translateX(70%) translateY(-5px) rotate(-2deg)' },
                            '100%': { transform: 'translateX(180%) translateY(0px) rotate(0deg)' },
                        },
                        bounceLight: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' },
                        },
                        bounceGentle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-3px)' },
                        },
                        spinSlow: {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(360deg)' },
                        },
                        spinMedium: {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(360deg)' },
                        },
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        },
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '25%': { transform: 'translateX(-5px)' },
                            '75%': { transform: 'translateX(5px)' },
                        },
                        pulseScale: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.05)' },
                        },
                        rotateY: {
                            '0%': { opacity: '0', transform: 'rotateY(90deg)' },
                            '100%': { opacity: '1', transform: 'rotateY(0)' },
                        },
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
        .delay-500 { animation-delay: 0.5s; }
        .delay-600 { animation-delay: 0.6s; }
        .delay-700 { animation-delay: 0.7s; }
        .hover-lift {
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .hover-lift:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 40px -15px rgba(0,0,0,0.2);
        }
        .scroll-reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.9s ease, transform 0.8s ease;
        }
        .scroll-reveal.revealed {
            opacity: 1;
            transform: translateY(0);
        }
        .card-border-glow:hover {
            border-color: #D4AF37;
            box-shadow: 0 0 30px rgba(212,175,55,0.25);
        }
        .hero-image-overlay {
            background: linear-gradient(135deg, rgba(30,58,95,0.9), rgba(15,42,64,0.85));
        }
        .image-hover-zoom {
            transition: transform 0.5s ease, box-shadow 0.3s ease;
        }
        .image-hover-zoom:hover {
            transform: scale(1.03);
            box-shadow: 0 25px 40px -15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="bg-warm text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import ReactDOM from 'react-dom/client';

        // EASY CUSTOMIZATION: Replace these image paths with your actual image URLs
        const COMPANY_LOGO = 'greenlanelogo.jpg'; // Your company logo
        const HILDA_IMAGE = 'hilda.jpg';
        const CAROL_IMAGE = 'carol.png';
        
        // Fallback images if your images don't load
        const FALLBACK_HILDA = 'https://via.placeholder.com/500x500?text=Hilda+Ndlovu';
        const FALLBACK_CAROL = 'https://via.placeholder.com/500x500?text=Carol+Zandamela';

        const RevealOnScroll = ({ children, delay = 0 }) => {
            const ref = useRef(null);
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setTimeout(() => entry.target.classList.add('revealed'), delay);
                        }
                    });
                }, { threshold: 0.1, rootMargin: "0px 0px -60px 0px" });
                if (ref.current) observer.observe(ref.current);
                return () => { if(ref.current) observer.unobserve(ref.current); };
            }, [delay]);
            return <div ref={ref} className="scroll-reveal">{children}</div>;
        };

        const Header = ({ logo }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const navLinks = [
                { name: 'Home', href: '#home' },
                { name: 'Services', href: '#services' },
                { name: 'Leadership', href: '#leadership' },
                { name: 'Market', href: '#market' },
                { name: 'Contact', href: '#contact' },
            ];
            return (
                <header className="sticky top-0 z-[1000] bg-gradient-to-r from-primary to-secondary text-white shadow-xl">
                    <div className="container mx-auto px-5 py-3 flex justify-between items-center">
                        <div className="flex items-center cursor-pointer" onClick={() => window.location.href = '#home'}>
                            <img src={logo} alt="Greenlane Trading 101" className="h-16 w-auto object-contain animate-pulse-slow hover:scale-105 transition-transform duration-300" />
                        </div>
                        <button className="md:hidden text-2xl focus:outline-none hover:text-accent transition" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                            <i className={`fas ${isMenuOpen ? 'fa-times' : 'fa-bars'}`}></i>
                        </button>
                        <nav className={`${isMenuOpen ? 'flex' : 'hidden'} md:flex absolute md:relative top-full left-0 w-full md:w-auto bg-secondary/95 md:bg-transparent backdrop-blur-md md:backdrop-blur-0 flex-col md:flex-row p-5 md:p-0 gap-4 md:gap-7 text-center shadow-xl md:shadow-none z-50`}>
                            {navLinks.map((link, idx) => (
                                <a key={link.name} href={link.href} className="text-sm font-semibold uppercase tracking-wide hover:text-accent transition-all duration-300 relative after:content-[''] after:absolute after:bottom-[-5px] after:left-0 after:w-0 after:h-[2px] after:bg-accent after:transition-all hover:after:w-full" onClick={() => setIsMenuOpen(false)} style={{ animationDelay: `${idx * 0.05}s` }}>
                                    {link.name}
                                </a>
                            ))}
                        </nav>
                    </div>
                </header>
            );
        };

        const Hero = () => {
            return (
                <section id="home" className="relative min-h-screen flex items-center justify-center overflow-hidden">
                    <div className="absolute inset-0 z-0">
                        <div className="absolute inset-0 hero-image-overlay z-10"></div>
                        <img 
                            src="https://images.pexels.com/photos/34598788/pexels-photo-34598788.jpeg" 
                            alt="Logistics truck at port" 
                            className="w-full h-full object-cover object-center scale-110 animate-float-slow"
                        />
                    </div>
                    
                    <div className="absolute inset-0 pointer-events-none z-10">
                        <div className="absolute top-20 left-10 w-72 h-72 rounded-full bg-accent/10 blur-3xl animate-float"></div>
                        <div className="absolute bottom-20 right-10 w-96 h-96 rounded-full bg-accent/10 blur-3xl animate-float-slow"></div>
                        <div className="absolute top-1/2 left-1/3 w-40 h-40 rounded-full bg-accent/5 blur-2xl animate-float-fast"></div>
                    </div>
                    
                    <div className="container mx-auto px-5 relative z-20 text-center max-w-5xl">
                        <div className="animate-fadeDown">
                            <span className="inline-block px-4 py-1 rounded-full bg-accent/20 text-accent text-sm font-semibold tracking-wide mb-6 animate-pulse-slow backdrop-blur-sm">Welcome to Greenlane</span>
                            <h1 className="text-5xl md:text-7xl font-extrabold leading-tight drop-shadow-xl animate-fadeUp delay-100 text-white">
                                Simplify & <span className="text-accent animate-glowPulse">Professionalise</span><br/>Trade Facilitation
                            </h1>
                            <p className="text-xl md:text-2xl mt-6 text-white/95 max-w-3xl mx-auto animate-fadeUp delay-200 drop-shadow-md">
                                KwaZulu-Natal based import, export, and customs clearing business near the Port of Durban — the busiest container terminal in Africa.
                            </p>
                            <div className="mt-10 flex flex-wrap justify-center gap-5 animate-fadeUp delay-300">
                                <a href="#services" className="bg-accent hover:bg-white hover:text-primary text-primary font-bold px-8 py-4 rounded-full transition-all duration-300 transform hover:scale-105 shadow-2xl inline-flex items-center gap-2 animate-bounceGentle"><i className="fas fa-arrow-right"></i> Explore Services</a>
                                <a href="#contact" className="border-2 border-white hover:bg-white/20 text-white font-semibold px-8 py-4 rounded-full transition-all duration-300 hover:scale-105 inline-flex items-center gap-2"><i className="fas fa-envelope"></i> Get in Touch</a>
                            </div>
                        </div>
                    </div>
                    
                    <div className="absolute bottom-8 left-1/2 transform -translate-x-1/2 animate-bounceLight z-20">
                        <a href="#executive" className="text-white/70 hover:text-accent transition"><i className="fas fa-chevron-down text-2xl"></i></a>
                    </div>
                </section>
            );
        };

        const AnimatedLogistics = () => {
            return (
                <RevealOnScroll>
                    <section className="py-20 bg-gradient-to-br from-primary/5 via-soft to-white overflow-hidden">
                        <div className="container mx-auto px-5">
                            <div className="text-center mb-12">
                                <i className="fas fa-globe-africa text-5xl text-accent mb-3 animate-spinSlow inline-block"></i>
                                <h2 className="text-4xl font-bold text-primary mt-2 animate-fadeUp">Global Logistics Network</h2>
                                <div className="w-24 h-1 bg-accent mx-auto mt-3 rounded-full animate-pulseScale"></div>
                                <p className="text-gray-600 mt-4 max-w-2xl mx-auto animate-fadeUp delay-100">Seamless movement of goods across borders with our integrated transport solutions</p>
                            </div>
                            
                            <div className="relative bg-white/60 rounded-3xl p-8 md:p-12 shadow-xl overflow-hidden border border-accent/30 animate-zoomSoft">
                                <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-accent/5 to-transparent pointer-events-none"></div>
                                
                                <div className="relative mb-16 overflow-hidden">
                                    <div className="absolute inset-0 flex items-center">
                                        <div className="w-full h-0.5 bg-gradient-to-r from-transparent via-accent/60 to-transparent animate-pulseScale"></div>
                                    </div>
                                    <div className="animate-driveTruck relative z-10">
                                        <div className="flex items-center gap-3 bg-primary/15 rounded-2xl px-6 py-4 inline-flex shadow-lg backdrop-blur-sm hover:bg-primary/25 transition-all duration-300">
                                            <i className="fas fa-truck-fast text-5xl text-accent animate-wiggle"></i>
                                            <div className="ml-3">
                                                <p className="font-bold text-primary text-lg">Road Freight</p>
                                                <p className="text-sm text-gray-700">Express delivery • Cross-border transport</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="relative mb-16 overflow-hidden">
                                    <div className="absolute inset-0 flex items-center justify-center">
                                        <div className="w-full h-0.5 bg-gradient-to-r from-transparent via-accent/40 to-transparent"></div>
                                    </div>
                                    <div className="animate-flyPlane relative z-10">
                                        <div className="flex items-center gap-3 bg-secondary/15 rounded-2xl px-6 py-4 inline-flex shadow-lg backdrop-blur-sm hover:bg-secondary/25 transition-all duration-300">
                                            <i className="fas fa-plane text-5xl text-accent transform -rotate-12 animate-bounceGentle"></i>
                                            <div className="ml-3">
                                                <p className="font-bold text-primary text-lg">Air Cargo</p>
                                                <p className="text-sm text-gray-700">Rapid transit • Global reach</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="relative mt-8 pt-4">
                                    <div className="flex justify-between items-center">
                                        <div className="text-center animate-pulse-slow">
                                            <i className="fas fa-map-marker-alt text-accent text-2xl animate-bounceLight"></i>
                                            <p className="text-xs text-gray-600 mt-1 font-semibold">Origin</p>
                                        </div>
                                        <div className="flex-1 mx-4 relative">
                                            <div className="h-1 bg-gradient-to-r from-accent via-accent to-accent/30 rounded-full"></div>
                                            <div className="absolute top-1/2 left-1/4 w-2 h-2 bg-accent rounded-full animate-ping"></div>
                                            <div className="absolute top-1/2 left-1/2 w-2 h-2 bg-accent rounded-full animate-ping delay-300"></div>
                                            <div className="absolute top-1/2 left-3/4 w-2 h-2 bg-accent rounded-full animate-ping delay-500"></div>
                                        </div>
                                        <div className="text-center animate-pulse-slow">
                                            <i className="fas fa-flag-checkered text-accent text-2xl animate-bounceLight"></i>
                                            <p className="text-xs text-gray-600 mt-1 font-semibold">Destination</p>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-4 mt-8 text-center">
                                        {[
                                            { icon: "fa-ship", label: "Sea Freight" },
                                            { icon: "fa-train", label: "Rail Logistics" },
                                            { icon: "fa-warehouse", label: "Warehousing" }
                                        ].map((item, idx) => (
                                            <div key={idx} className="bg-primary/5 p-3 rounded-xl hover:scale-105 transition-all duration-300 cursor-pointer animate-fadeUp" style={{ animationDelay: `${idx * 0.1}s` }}>
                                                <i className={`fas ${item.icon} text-accent text-2xl animate-bounceGentle`}></i>
                                                <p className="font-semibold text-sm mt-1 text-primary">{item.label}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                
                                <div className="absolute top-5 left-5 w-20 h-20 border border-accent/30 rounded-full animate-float"></div>
                                <div className="absolute bottom-5 right-5 w-32 h-32 border border-accent/20 rounded-full animate-float-slow"></div>
                                <div className="absolute top-1/2 right-10 w-10 h-10 border border-accent/40 rounded-full animate-spinSlow"></div>
                            </div>
                        </div>
                    </section>
                </RevealOnScroll>
            );
        };

        const ExecutiveSummary = () => {
            return (
                <RevealOnScroll>
                    <section id="executive" className="py-20 bg-white">
                        <div className="container mx-auto px-5 max-w-5xl">
                            <div className="bg-gradient-to-br from-primary/5 via-white to-accent/5 p-8 md:p-10 rounded-3xl shadow-xl border-l-[8px] border-accent hover:shadow-2xl transition-all duration-500">
                                <div className="flex items-center gap-3 mb-5">
                                    <i className="fas fa-chart-line text-3xl text-accent animate-bounceLight"></i>
                                    <h2 className="text-3xl md:text-4xl font-bold text-primary animate-fadeRight">Executive Summary</h2>
                                </div>
                                <p className="text-gray-700 text-lg mb-5 leading-relaxed animate-fadeRight delay-100">
                                    Greenlane Trading 101 (Pty) Ltd is a KwaZulu-Natal based import, export, and customs clearing business established to simplify and professionalise trade facilitation for South African and regional businesses.
                                </p>
                                <p className="text-gray-700 text-lg mb-5 leading-relaxed animate-fadeRight delay-200">
                                    Strategically located near the Port of Durban, the busiest container terminal in Africa, the company provides compliant, efficient, and transparent logistics coordination and customs clearing services to SMEs, manufacturers, retailers, and cross-border traders.
                                </p>
                                <p className="text-gray-700 text-lg leading-relaxed animate-fadeRight delay-300">
                                    The business is founded and led by a qualified professional with decades of experience in financial management, governance, and operations leadership.
                                </p>
                                <div className="mt-8 grid grid-cols-2 md:grid-cols-5 gap-3 text-center animate-zoomSoft delay-400">
                                    {["Compliance-first","Transparent Pricing","Digital Systems","Relationship-based","Ethical Leadership"].map((item, idx) => (
                                        <div key={item} className="bg-primary/10 py-2 rounded-full text-primary font-semibold text-sm md:text-base hover:bg-accent hover:text-primary transition-all duration-300 cursor-default animate-pulseScale" style={{ animationDelay: `${idx * 0.1}s` }}>{item}</div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>
                </RevealOnScroll>
            );
        };

        const VisionMission = () => {
            return (
                <RevealOnScroll>
                    <section className="py-20 bg-soft">
                        <div className="container mx-auto px-5">
                            <div className="text-center mb-14">
                                <i className="fas fa-star-of-life text-3xl text-accent mb-2 animate-spinMedium"></i>
                                <h2 className="text-4xl font-bold text-primary inline-block relative pb-3 animate-fadeDown">Our Compass</h2>
                                <div className="w-24 h-1 bg-accent mx-auto mt-2 rounded-full animate-pulseScale"></div>
                            </div>
                            <div className="grid md:grid-cols-3 gap-8">
                                <div className="bg-white p-8 rounded-2xl shadow-lg hover-lift border-b-4 border-primary text-center animate-fadeLeft delay-100">
                                    <i className="fas fa-eye text-5xl text-accent mb-4 hover:scale-110 transition-transform duration-300 animate-bounceGentle"></i>
                                    <h3 className="text-2xl font-bold text-primary">Vision</h3>
                                    <p className="text-gray-600 mt-3">To become one of South Africa's most trusted and efficient trade facilitation partners, enabling businesses to access global markets with confidence.</p>
                                </div>
                                <div className="bg-white p-8 rounded-2xl shadow-lg hover-lift border-b-4 border-accent text-center animate-fadeUp delay-200">
                                    <i className="fas fa-bullseye text-5xl text-primary mb-4 hover:scale-110 transition-transform duration-300 animate-bounceGentle"></i>
                                    <h3 className="text-2xl font-bold text-primary">Mission</h3>
                                    <p className="text-gray-600 mt-3">Remove complexity from import/export through professional, compliant, and customer-centred clearing and forwarding solutions.</p>
                                </div>
                                <div className="bg-white p-8 rounded-2xl shadow-lg hover-lift border-b-4 border-secondary text-center animate-fadeRight delay-300">
                                    <i className="fas fa-heart text-5xl text-accent mb-4 hover:scale-110 transition-transform duration-300 animate-pulse-slow"></i>
                                    <h3 className="text-2xl font-bold text-primary">Values</h3>
                                    <p className="font-bold text-gray-800">Integrity • Stewardship • Excellence • Accountability • Service</p>
                                    <p className="text-gray-500 text-sm mt-3">Business as an engine for ethical impact.</p>
                                </div>
                            </div>
                        </div>
                    </section>
                </RevealOnScroll>
            );
        };

        const Services = () => {
            const servicesList = [
                { icon:"fa-file-invoice", title:"Customs Clearing", desc:"SARS documentation & compliance. Ensuring compliant customs documentation, facilitating seamless import/export processes." },
                { icon:"fa-truck-fast", title:"Freight Forwarding", desc:"Sea, Air, Road logistics coordination. Optimizing delivery efficiency and reliability." },
                { icon:"fa-handshake", title:"Import/Export Brokerage", desc:"Acting as intermediaries, connecting suppliers and buyers, streamlining trade transactions." },
                { icon:"fa-file-signature", title:"Documentation Services", desc:"Permits, licenses, certificates. Comprehensive documentation support." },
                { icon:"fa-warehouse", title:"Warehousing", desc:"Storage & consolidation solutions for flexible warehousing needs." },
                { icon:"fa-chart-simple", title:"Advisory", desc:"New exporter onboarding and consulting. Expert guidance for businesses new to trade." }
            ];
            return (
                <RevealOnScroll>
                    <section id="services" className="py-24 bg-white">
                        <div className="container mx-auto px-5">
                            <div className="text-center mb-14">
                                <i className="fas fa-cogs text-3xl text-accent mb-2 animate-spinSlow"></i>
                                <h2 className="text-4xl font-bold text-primary inline-block relative pb-3 animate-fadeDown">Core Services</h2>
                                <div className="w-24 h-1 bg-accent mx-auto mt-2 rounded-full animate-pulseScale"></div>
                            </div>
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {servicesList.map((s, idx) => (
                                    <div key={idx} className="group bg-soft p-7 rounded-2xl shadow-md hover-lift card-border-glow transition-all duration-500 border-l-4 border-secondary hover:border-accent animate-fadeUp" style={{ animationDelay: `${idx * 0.08}s` }}>
                                        <i className={`fas ${s.icon} text-4xl text-accent mb-4 group-hover:scale-110 group-hover:rotate-3 transition-all duration-300 animate-bounceGentle`}></i>
                                        <h3 className="text-xl font-extrabold text-primary">{s.title}</h3>
                                        <p className="text-gray-600 mt-2">{s.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                </RevealOnScroll>
            );
        };

        const Differentiators = () => {
            return (
                <section className="py-20 bg-gradient-to-r from-primary to-secondary text-white relative overflow-hidden">
                    <div className="absolute inset-0 opacity-10">
                        <div className="absolute top-0 left-0 w-64 h-64 bg-accent rounded-full blur-3xl animate-float"></div>
                        <div className="absolute bottom-0 right-0 w-80 h-80 bg-accent rounded-full blur-3xl animate-float-slow"></div>
                        <div className="absolute top-1/2 left-1/2 w-96 h-96 bg-accent rounded-full blur-3xl animate-spinSlow"></div>
                    </div>
                    <div className="container mx-auto px-5 relative z-10">
                        <div className="text-center mb-12 animate-fadeUp">
                            <i className="fas fa-gem text-3xl text-accent mb-2 animate-spinMedium"></i>
                            <h2 className="text-3xl md:text-4xl font-bold">Why Choose Greenlane</h2>
                            <div className="w-24 h-1 bg-accent mx-auto mt-3 rounded-full animate-pulseScale"></div>
                        </div>
                        <div className="grid md:grid-cols-4 gap-6">
                            {[
                                {icon:"fa-shield-haltered", title:"Compliance-first", desc:"Regulatory adherence with expert oversight."},
                                {icon:"fa-tag", title:"Transparent Pricing", desc:"No hidden fees, trust-driven relationships."},
                                {icon:"fa-microchip", title:"Digital Systems", desc:"Real-time tracking & documentation."},
                                {icon:"fa-leaf", title:"Ethical Leadership", desc:"Integrity & community impact."}
                            ].map((item, idx) => (
                                <div key={idx} className="bg-white/10 backdrop-blur-md p-6 rounded-2xl text-center hover:bg-white/20 transition-all duration-500 hover:scale-105 animate-fadeUp" style={{ animationDelay: `${idx * 0.1}s` }}>
                                    <i className={`fas ${item.icon} text-4xl text-accent mb-3 animate-bounceLight`}></i>
                                    <h3 className="text-xl font-bold">{item.title}</h3>
                                    <p className="text-white/80 text-sm mt-2">{item.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const MarketOpportunity = () => {
            return (
                <RevealOnScroll>
                    <section id="market" className="py-24 bg-soft">
                        <div className="container mx-auto px-5">
                            <div className="text-center mb-14">
                                <i className="fas fa-chart-line text-3xl text-accent mb-2 animate-bounceLight"></i>
                                <h2 className="text-4xl font-bold text-primary animate-fadeDown">Market Opportunity</h2>
                                <div className="w-24 h-1 bg-accent mx-auto mt-2 rounded-full animate-pulseScale"></div>
                            </div>
                            <div className="grid lg:grid-cols-2 gap-12">
                                <div className="bg-white p-8 rounded-2xl shadow-lg animate-fadeLeft hover-lift">
                                    <h3 className="text-2xl font-bold text-secondary flex items-center gap-2"><i className="fas fa-ship text-accent text-3xl animate-bounceGentle"></i> Port of Durban</h3>
                                    <ul className="mt-5 space-y-3 text-gray-700">
                                        <li className="flex items-start gap-3 animate-fadeRight delay-100"><i className="fas fa-check-circle text-accent mt-1"></i> Handles significant container traffic in Africa</li>
                                        <li className="flex items-start gap-3 animate-fadeRight delay-200"><i className="fas fa-check-circle text-accent mt-1"></i> Connects to SADC and global markets</li>
                                        <li className="flex items-start gap-3 animate-fadeRight delay-300"><i className="fas fa-check-circle text-accent mt-1"></i> Supports manufacturing, retail, and e-commerce growth</li>
                                    </ul>
                                    <h3 className="text-2xl font-bold text-secondary mt-8 mb-4">Industry Drivers</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {["SME import growth", "AfCFTA expansion", "Compliance needs", "E-commerce boom"].map((driver, idx) => (
                                            <div key={driver} className="bg-primary/5 p-3 rounded-lg text-center hover:scale-105 transition-all duration-300 animate-zoomSoft" style={{ animationDelay: `${idx * 0.1}s` }}><i className="fas fa-chart-simple text-accent mr-2"></i> {driver}</div>
                                        ))}
                                    </div>
                                </div>
                                <div className="space-y-6 animate-fadeRight">
                                    <div className="bg-white p-6 rounded-xl shadow-md hover-lift">
                                        <i className="fas fa-building text-3xl text-accent mb-3 animate-bounceGentle"></i>
                                        <h3 className="font-bold text-xl text-primary">SMEs</h3>
                                        <p className="text-gray-600">Small and medium enterprises importing/exporting goods require efficient customs clearing and logistics support.</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-md hover-lift">
                                        <i className="fas fa-industry text-3xl text-accent mb-3 animate-bounceGentle"></i>
                                        <h3 className="font-bold text-xl text-primary">Manufacturers</h3>
                                        <p className="text-gray-600">Local manufacturers depend on reliable customs services for smooth importation of materials and export of products.</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-md hover-lift">
                                        <i className="fas fa-shopping-cart text-3xl text-accent mb-3 animate-bounceGentle"></i>
                                        <h3 className="font-bold text-xl text-primary">Retailers</h3>
                                        <p className="text-gray-600">Retail businesses seek professional clearing partners to ensure timely deliveries and compliance.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </RevealOnScroll>
            );
        };

        const Leadership = () => {
            return (
                <RevealOnScroll>
                    <section id="leadership" className="py-24 bg-white">
                        <div className="container mx-auto px-5">
                            <div className="text-center mb-16">
                                <i className="fas fa-users text-3xl text-accent mb-2 animate-spinMedium"></i>
                                <h2 className="text-4xl font-bold text-primary animate-fadeDown">Leadership</h2>
                                <div className="w-24 h-1 bg-accent mx-auto mt-2 rounded-full animate-pulseScale"></div>
                            </div>
                            {/* Hilda Ndlovu */}
                            <div className="flex flex-col lg:flex-row gap-12 items-center mb-20">
                                <div className="lg:w-1/2 order-2 lg:order-1 space-y-5 animate-fadeLeft">
                                    <h3 className="text-3xl font-bold text-primary">Hilda Ndlovu</h3>
                                    <p className="text-xl text-secondary font-semibold">Founder & CEO</p>
                                    <p className="text-gray-700">Qualified professional with decades of experience across accounting, financial governance, and organisational leadership.</p>
                                    <ul className="space-y-2">
                                        {["Financial oversight & compliance","Building & leading operational teams","Strategic leadership at executive level"].map((item, idx) => (
                                            <li key={item} className="flex gap-2 animate-fadeRight" style={{ animationDelay: `${idx * 0.1}s` }}><i className="fas fa-check-circle text-accent mt-1"></i> {item}</li>
                                        ))}
                                    </ul>
                                </div>
                                <div className="lg:w-1/2 order-1 lg:order-2 flex justify-center animate-fadeRight">
                                    <div className="rounded-2xl overflow-hidden shadow-2xl image-hover-zoom w-80 h-80 bg-gray-200 flex items-center justify-center border-4 border-accent/30">
                                        <img src={HILDA_IMAGE} alt="Hilda Ndlovu" className="w-full h-full object-cover" onError={(e) => e.target.src = FALLBACK_HILDA} />
                                    </div>
                                </div>
                            </div>
                            
                            {/* Carol Zandamela */}
                            <div className="flex flex-col lg:flex-row gap-12 items-center mt-16 pt-10 border-t-2 border-gray-100">
                                <div className="lg:w-1/2 flex justify-center order-1 lg:order-1 animate-fadeLeft">
                                    <div className="rounded-2xl overflow-hidden shadow-2xl image-hover-zoom w-80 h-80 bg-gray-200 flex items-center justify-center border-4 border-accent/30">
                                        <img src={CAROL_IMAGE} alt="Carol Zandamela" className="w-full h-full object-cover" onError={(e) => e.target.src = FALLBACK_CAROL} />
                                    </div>
                                </div>
                                <div className="lg:w-1/2 order-2 lg:order-2 space-y-4 animate-fadeRight">
                                    <h3 className="text-3xl font-bold text-primary">Carol Zandamela</h3>
                                    <p className="text-xl text-secondary font-semibold">Group Executive Chairperson</p>
                                    <p className="text-gray-700 leading-relaxed">Carol is a highly experienced executive with over 25 years in the corporate world, specializing in operational efficiency, strategic planning, and technological innovation.</p>
                                    <p className="text-gray-700 leading-relaxed">She focuses on aligning organizational goals with technology initiatives, committed to driving sustainable growth and improving overall performance.</p>
                                    <div className="bg-primary/5 p-4 rounded-xl border-l-4 border-accent mt-3 animate-pulseScale">
                                        <p className="text-primary font-medium">✨ Driving operational excellence, strategic growth, and innovation at Greenlane.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </RevealOnScroll>
            );
        };

        const Contact = () => {
            const [status, setStatus] = useState(null);
            const handleSubmit = (e) => { e.preventDefault(); setStatus('sending'); setTimeout(() => { setStatus('success'); alert('Thank you! We will respond shortly.'); }, 1000); };
            return (
                <section id="contact" className="py-24 bg-gradient-to-br from-secondary to-primary text-white relative overflow-hidden">
                    <div className="absolute inset-0 opacity-5">
                        <i className="fas fa-globe text-9xl absolute top-20 right-20 animate-spinSlow"></i>
                        <i className="fas fa-truck-fast text-8xl absolute bottom-20 left-20 animate-float"></i>
                    </div>
                    <div className="container mx-auto px-5 relative z-10">
                        <div className="grid lg:grid-cols-2 gap-12">
                            <div className="space-y-6 animate-fadeLeft">
                                <i className="fas fa-envelope-open-text text-4xl text-accent mb-2 animate-bounceLight"></i>
                                <h2 className="text-4xl font-bold">Contact Us</h2>
                                <p className="text-white/80 text-lg">Ready to simplify your trade facilitation? Reach out to our team.</p>
                                <div className="space-y-4 pt-4">
                                    <div className="flex items-center gap-4 group hover:translate-x-2 transition-transform"><i className="fas fa-map-marker-alt text-accent w-6"></i> <span>85 Livingstone Road, Windemere, Durban 4001</span></div>
                                    <div className="flex items-center gap-4 group hover:translate-x-2 transition-transform"><i className="fas fa-phone-alt text-accent w-6"></i> <span>+27 72 826 5071 / +27 82 350 2278</span></div>
                                    <div className="flex items-center gap-4 group hover:translate-x-2 transition-transform"><i className="fas fa-envelope text-accent w-6"></i> <div>hilda@greenlane101.com<br/>carol@greenlane101.com</div></div>
                                </div>
                            </div>
                            <form onSubmit={handleSubmit} className="bg-white/10 backdrop-blur-lg p-8 rounded-3xl border border-white/20 shadow-2xl animate-fadeRight hover:shadow-accent/20 transition-all duration-500">
                                <div className="space-y-4">
                                    <input type="text" placeholder="Your Name" required className="w-full bg-white/10 border border-white/20 rounded-xl px-5 py-3 outline-none focus:border-accent focus:bg-white/20 transition-all duration-300" />
                                    <input type="email" placeholder="Your Email" required className="w-full bg-white/10 border border-white/20 rounded-xl px-5 py-3 outline-none focus:border-accent focus:bg-white/20 transition-all duration-300" />
                                    <textarea placeholder="Your Message" rows={4} required className="w-full bg-white/10 border border-white/20 rounded-xl px-5 py-3 outline-none focus:border-accent focus:bg-white/20 transition-all duration-300 resize-none"></textarea>
                                    <button type="submit" disabled={status === 'sending'} className="w-full bg-accent hover:bg-white hover:text-primary text-primary font-bold py-3 rounded-xl transition-all duration-300 shadow-xl disabled:opacity-50 flex items-center justify-center gap-2 animate-pulseScale"><i className="fas fa-paper-plane"></i> {status === 'sending' ? 'Sending...' : 'Send Message'}</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = ({ logo }) => (
            <footer className="bg-secondary py-12 border-t border-white/10 text-center text-white/50 text-sm">
                <div className="container mx-auto px-5">
                    <img src={logo} className="h-14 mx-auto mb-4 opacity-80 hover:opacity-100 hover:scale-105 transition-all duration-300" alt="logo"/>
                    <p>© 2025 Greenlane Trading 101 (Pty) Ltd — All rights reserved.</p>
                    <p className="mt-2">KwaZulu-Natal, South Africa | Integrity-driven trade facilitation</p>
                </div>
            </footer>
        );

        const App = () => {
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('revealed'); });
                }, { threshold: 0.1 });
                document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);
            return (<><Header logo={COMPANY_LOGO}/><main><Hero/><AnimatedLogistics/><ExecutiveSummary/><VisionMission/><Services/><Differentiators/><MarketOpportunity/><Leadership/><Contact/></main><Footer logo={COMPANY_LOGO}/></>);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
