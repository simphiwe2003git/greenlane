                    <div className="container mx-auto px-4">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-bold text-primary inline-block relative pb-4 after:content-[''] after:absolute after:bottom-0 after:left-1/2 after:-translate-x-1/2 after:w-20 after:h-1 after:bg-accent after:rounded-full">Investment Opportunity</h2>
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                            <div className="bg-gradient-to-br from-primary/5 to-accent/5 p-8 rounded-2xl">
                                <h3 className="text-2xl font-bold text-primary mb-4">Funding Requirement</h3>
                                <p className="text-4xl font-bold text-accent mb-4">R3 - R4 Million</p>
                                <p className="text-gray-700 mb-6">To enhance infrastructure and facilitate growth. These funds will support technology investments, staffing, marketing initiatives, and essential operational costs.</p>
                                <div className="space-y-4">
                                    <h4 className="font-bold text-secondary">Use of Funds:</h4>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-white p-3 rounded-lg shadow"><span className="font-bold">Licensing & compliance</span> R350k</div>
                                        <div className="bg-white p-3 rounded-lg shadow"><span className="font-bold">Systems/software</span> R400k</div>
                                        <div className="bg-white p-3 rounded-lg shadow"><span className="font-bold">Staff runway</span> R900k</div>
                                        <div className="bg-white p-3 rounded-lg shadow"><span className="font-bold">Office & equipment</span> R500k</div>
                                        <div className="bg-white p-3 rounded-lg shadow"><span className="font-bold">Vehicle</span> R450k</div>
                                        <div className="bg-white p-3 rounded-lg shadow"><span className="font-bold">Working capital</span> R400k</div>
                                    </div>
                                </div>
                            </div>
                            <div className="space-y-6">
                                <div className="bg-gray-50 p-6 rounded-xl">
                                    <h3 className="text-xl font-bold text-primary mb-2">Break-even Timeline</h3>
                                    <p className="text-3xl font-bold text-accent">12-18 months</p>
                                    <p className="text-gray-600 mt-2">Contingent upon effective client acquisition strategies, operational efficiencies, and revenue growth.</p>
                                </div>
                                <div className="bg-gray-50 p-6 rounded-xl">
                                    <h3 className="text-xl font-bold text-primary mb-2">Year 3 Projections</h3>
                                    <p className="text-3xl font-bold text-accent">R14 Million</p>
                                    <p className="text-gray-600 mt-2">Target revenue based on solid client acquisition and operational efficiency.</p>
                                </div>
                                <div className="bg-gray-50 p-6 rounded-xl">
                                    <h3 className="text-xl font-bold text-primary mb-2">Operations Plan</h3>
                                    <div className="space-y-2 text-sm">
                                        <div><span className="font-bold">Phase 1 (0-3 mos):</span> SARS registration, office setup, software, hire 2-3 agents, secure 5-10 clients</div>
                                        <div><span className="font-bold">Phase 2 (3-12 mos):</span> Freight partnerships, marketing, expand to 25-40 clients</div>
                                        <div><span className="font-bold">Phase 3 (Year 2-3):</span> Own warehouse, regional expansion, cross-border services</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // --- Contact Component (Updated with PDF contact info) ---
        const Contact = () => {
            const [status, setStatus] = useState(null);
            const handleSubmit = (e) => {
                e.preventDefault();
                setStatus('sending');
                setTimeout(() => {
                    setStatus('success');
                    alert('Thank you for your message! Hilda will get back to you soon.');
                }, 1500);
            };
            return (
                <section id="contact" className="py-24 bg-gradient-to-br from-secondary to-primary text-white">
                    <div className="container mx-auto px-4">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-16">
                            <div className="space-y-8">
                                <div>
                                    <h2 className="text-4xl font-bold mb-6">Contact Us</h2>
                                    <p className="text-white/80 text-lg">Ready to simplify your trade facilitation? Reach out to our team for a consultation.</p>
                                </div>
                                <div className="space-y-6">
                                    <h3 className="text-2xl font-semibold text-accent">Get In Touch</h3>
                                    <div className="space-y-4">
                                        <div className="flex items-center gap-4 group">
                                            <div className="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center group-hover:bg-accent transition-colors"><i className="fas fa-map-marker-alt"></i></div>
                                            <span>85 Livingstone Road, Windemere, Durban 4001, South Africa</span>
                                        </div>
                                        <div className="flex items-center gap-4 group">
                                            <div className="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center group-hover:bg-accent transition-colors"><i className="fas fa-phone"></i></div>
                                            <span>+27 72 826 5071 / +27 82 350 2278</span>
                                        </div>
                                        <div className="flex items-center gap-4 group">
                                            <div className="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center group-hover:bg-accent transition-colors"><i className="fas fa-envelope"></i></div>
                                            <div>
                                                <p>hilda@greenlane101.com</p>
                                                <p>carol@greenlane101.com</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-4">
                                    {['facebook-f', 'twitter', 'linkedin-in'].map(social => (
                                        <a key={social} href="#" className="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center hover:bg-accent hover:-translate-y-1 transition-all text-xl">
                                            <i className={`fab fa-${social}`}></i>
                                        </a>
                                    ))}
                                </div>
                            </div>
                            <form onSubmit={handleSubmit} className="bg-white/10 backdrop-blur-lg p-10 rounded-3xl border border-white/20 shadow-2xl">
                                <div className="space-y-4">
                                    <input type="text" placeholder="Your Name" required className="w-full bg-white/10 border border-white/20 rounded-xl px-6 py-4 outline-none focus:border-accent focus:bg-white/20 transition-all placeholder:text-white/60" />
                                    <input type="email" placeholder="Your Email" required className="w-full bg-white/10 border border-white/20 rounded-xl px-6 py-4 outline-none focus:border-accent focus:bg-white/20 transition-all placeholder:text-white/60" />
                                    <input type="text" placeholder="Subject" className="w-full bg-white/10 border border-white/20 rounded-xl px-6 py-4 outline-none focus:border-accent focus:bg-white/20 transition-all placeholder:text-white/60" />
                                    <textarea placeholder="Your Message" rows={5} required className="w-full bg-white/10 border border-white/20 rounded-xl px-6 py-4 outline-none focus:border-accent focus:bg-white/20 transition-all placeholder:text-white/60 resize-none"></textarea>
                                    <button type="submit" disabled={status === 'sending'} className="w-full bg-accent hover:bg-white hover:text-primary text-white font-bold py-4 rounded-xl transition-all shadow-xl disabled:opacity-50">
                                        {status === 'sending' ? 'Sending...' : 'Send Message'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            );
        };

        // --- Footer Component ---
        const Footer = ({ logo }) => {
            return (
                <footer className="bg-secondary text-white py-16 border-t border-white/10">
                    <div className="container mx-auto px-4">
                        <div className="flex flex-col md:flex-row justify-between items-center gap-10 mb-12">
                            <div className="flex items-center gap-4">
                                <img src={logo} alt="Greenlane Trading 101" className="h-16 w-auto object-contain" />
                                <div>
                                    <h2 className="text-2xl font-bold">Greenlane <span className="text-accent">Trading</span> 101</h2>
                                    <p className="text-sm opacity-60">Import • Export • Customs Clearing</p>
                                </div>
                            </div>
                            <div className="flex flex-wrap justify-center gap-8 text-sm font-medium">
                                <a href="#" className="hover:text-accent transition-colors">Privacy Policy</a>
                                <a href="#" className="hover:text-accent transition-colors">Terms of Service</a>
                                <a href="#" className="hover:text-accent transition-colors">Sitemap</a>
                            </div>
                        </div>
                        <div className="pt-8 border-t border-white/5 text-center text-white/40 text-sm">
                            <p>&copy; {new Date().getFullYear()} Greenlane Trading 101 (Pty) Ltd. All rights reserved.</p>
                            <p className="mt-2">85 Livingstone Road, Windemere, Durban 4001 | KwaZulu-Natal, South Africa</p>
                        </div>
                    </div>
                </footer>
            );
        };

        // --- Main App Component ---
        const App = () => {
            return (
                <div className="min-h-screen">
                    <Header logo={DEFAULT_LOGO} />
                    <main>
                        <Hero />
                        <ExecutiveSummary />
                        <VisionMission />
                        <Services />
                        <Differentiators />
                        <MarketOpportunity />
                        <Leadership />
                        <Investment />
                        <Contact />
                    </main>
                    <Footer logo={DEFAULT_LOGO} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
